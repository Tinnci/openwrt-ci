name: AX5 JDCloud - Build firmware
run-name: AX5 JDCloud - Build ${{ github.run_number }} - ${{ github.ref_name }} - publish=${{ inputs.publish }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Releases (main branch only; replaces stable assets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ax5-build-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWRT_PATH: ${{ github.workspace }}/openwrt
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  build:
    name: AX5 JDCloud - 编译与打包
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      build_id: ${{ steps.identity.outputs.build_id }}
      firmware_artifact: ${{ steps.identity.outputs.firmware_artifact }}
    steps:
      - name: 01 - 准备构建磁盘与交换空间
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 4096
          temp-reserve-mb: 1024
          root-reserve-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: 02 - 检出构建仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 03 - 生成统一构建标识
        id: identity
        run: python3 scripts/ax5-build.py identity

      - name: 04 - 检查构建脚本与策略
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/customize-ax5.sh

      - name: 05 - 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates subversion time xsltproc libelf-dev libzstd-dev \
            zstd libtool autoconf automake cmake ninja-build pkgconf \
            libfuse-dev liblzma-dev help2man patch perl
          df -h

      - name: 06 - 拉取锁定源码与配置
        run: |
          python3 scripts/ax5-build.py clone "$OPENWRT_PATH"
          python3 scripts/ax5-build.py prepare "$OPENWRT_PATH"

      - name: 07 - 恢复编译器缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwrt/.ccache
          key: ax5-ccache-${{ runner.os }}-${{ hashFiles('configs/ax5-build.lock.json', 'configs/ipq60xx-custom-wifi.config') }}-${{ github.run_id }}
          restore-keys: |
            ax5-ccache-${{ runner.os }}-${{ hashFiles('configs/ax5-build.lock.json', 'configs/ipq60xx-custom-wifi.config') }}-

      - name: 08 - 安装 feeds 并核验配置
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          python3 "$GITHUB_WORKSPACE/scripts/ax5-build.py" patch-feeds .
          ./scripts/feeds install -a
          bash "$GITHUB_WORKSPACE/scripts/customize-ax5.sh"
          python3 "$GITHUB_WORKSPACE/scripts/ax5-build.py" configure .

      - name: 09 - 下载源码包
        working-directory: openwrt
        run: |
          mkdir -p logs/ci
          make download -j8 2>&1 | tee logs/ci/01-download.log

      - name: 10 - 并行编译（失败后单线程诊断）
        working-directory: openwrt
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" 2>&1 | tee logs/ci/02-compile.log; then
            echo "::warning::Parallel build failed; retrying with one job and verbose output"
            make -j1 V=s 2>&1 | tee logs/ci/03-compile-retry.log
          fi

      - name: 11 - 审计内核并打包产物
        run: python3 scripts/ax5-build.py bundle "$OPENWRT_PATH"

      - name: 12 - 上传固件、配套 APK 与溯源文件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.firmware_artifact }}
          path: openwrt/dist/
          if-no-files-found: error
          retention-days: 14

      - name: 13 - 上传诊断日志（含失败现场）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.diagnostics_artifact || format('ax5-jdcloud-diagnostics-r{0}-a{1}', github.run_id, github.run_attempt) }}
          include-hidden-files: true
          path: |
            openwrt/logs/
            openwrt/.config
            openwrt/provenance/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: AX5 JDCloud - 发布已校验产物
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BUILD_ID: ${{ needs.build.outputs.build_id }}
    steps:
      - name: 01 - 下载本次构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.firmware_artifact }}
          path: dist

      - name: 02 - 核验 SHA256
        working-directory: dist
        run: sha256sum --check "$BUILD_ID-sha256sums.txt"

      - name: 03 - 发布历史版本并刷新稳定下载入口
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          tag="$BUILD_ID"
          gh release create "$tag" dist/* --target "$BUILD_COMMIT" \
            --title "$BUILD_ID" --notes-file "dist/$BUILD_ID-release.md" --latest=false
          stable=IPQ60XX-CUSTOM-WIFI
          if ! gh release view "$stable" >/dev/null 2>&1; then
            gh release create "$stable" --target "$BUILD_COMMIT" \
              --title "AX5 JDCloud — latest published build" --notes-file "dist/$BUILD_ID-release.md" --latest
          fi
          # Stable is a download alias, not an immutable build reference.
          gh release view "$stable" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              gh release delete-asset "$stable" "$asset" --yes
            done
          gh release upload "$stable" dist/*
          gh release edit "$stable" --notes-file "dist/$BUILD_ID-release.md" --latest
