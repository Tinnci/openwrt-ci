name: IPQ60XX-CUSTOM-WIFI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Releases (main branch only; replaces stable assets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ax5-build-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWRT_PATH: ${{ github.workspace }}/openwrt
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Allocate build disk and swap
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 4096
          temp-reserve-mb: 1024
          root-reserve-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test build helpers
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/customize-ax5.sh

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates subversion time xsltproc libelf-dev libzstd-dev \
            zstd libtool autoconf automake cmake ninja-build pkgconf \
            libfuse-dev liblzma-dev help2man patch perl
          df -h

      - name: Fetch locked source and configure feeds
        run: |
          python3 scripts/ax5-build.py clone "$OPENWRT_PATH"
          python3 scripts/ax5-build.py prepare "$OPENWRT_PATH"

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwrt/.ccache
          key: ax5-ccache-${{ runner.os }}-${{ hashFiles('configs/ax5-build.lock.json', 'configs/ipq60xx-custom-wifi.config') }}-${{ github.run_id }}
          restore-keys: |
            ax5-ccache-${{ runner.os }}-${{ hashFiles('configs/ax5-build.lock.json', 'configs/ipq60xx-custom-wifi.config') }}-

      - name: Install locked feeds and customize
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash "$GITHUB_WORKSPACE/scripts/customize-ax5.sh"
          make defconfig
          python3 "$GITHUB_WORKSPACE/scripts/ax5-build.py" verify .
          python3 "$GITHUB_WORKSPACE/scripts/ax5-build.py" snapshot .

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log || \
            make -j1 V=s 2>&1 | tee -a build.log

      - name: Bundle firmware and matching packages
        run: python3 scripts/ax5-build.py bundle "$OPENWRT_PATH"

      - name: Upload firmware, packages and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ax5-jdcloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: openwrt/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ax5-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            openwrt/build.log
            openwrt/logs/
            openwrt/.config
            openwrt/provenance/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ax5-jdcloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Verify downloaded artifacts
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish historical archive and refresh stable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          tag="IPQ60XX-CUSTOM-WIFI-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/* --target "$BUILD_COMMIT" \
            --title "AX5 JDCloud $tag" --notes-file dist/RELEASE.md --latest=false
          stable=IPQ60XX-CUSTOM-WIFI
          if ! gh release view "$stable" >/dev/null 2>&1; then
            gh release create "$stable" --target "$BUILD_COMMIT" \
              --title "AX5 JDCloud — latest published build" --notes-file dist/RELEASE.md --latest
          fi
          # Stable is a download alias, not an immutable build reference.
          gh release view "$stable" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              gh release delete-asset "$stable" "$asset" --yes
            done
          gh release upload "$stable" dist/*
          gh release edit "$stable" --notes-file dist/RELEASE.md --latest
