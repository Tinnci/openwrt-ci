name: AX5 JDCloud - Check configuration
run-name: AX5 JDCloud - Check ${{ github.run_number }} - ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main, "experiment/**", "improve/**"]
    paths:
      - ".github/workflows/**"
      - "scripts/ax5-build.py"
      - "scripts/customize-ax5.sh"
      - "scripts/collect-emmc-telemetry.sh"
      - "scripts/benchmark-emmc.sh"
      - "configs/ax5-build.lock.json"
      - "configs/ipq60xx-custom-wifi.config"
      - "configs/ax5-dynamic-storage.mk"
      - "patches/feeds/**"
      - "patches/source/**"
      - "patches/kernel/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "configs/**"
      - "patches/feeds/**"
      - "patches/source/**"
      - "patches/kernel/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax5-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: AX5 JDCloud - 脚本与安全策略
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 01 - 检出构建仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: 02 - 运行单元测试与工作流策略检查
        run: python3 -m unittest discover -s tests -v
      - name: 03 - 检查 Shell 语法
        run: |
          bash -n scripts/customize-ax5.sh
          sh -n scripts/collect-emmc-telemetry.sh
          sh -n scripts/benchmark-emmc.sh
      - name: 04 - 检查 Shell 静态问题
        run: shellcheck scripts/customize-ax5.sh scripts/collect-emmc-telemetry.sh scripts/benchmark-emmc.sh

  config:
    name: AX5 JDCloud - 真实源码配置核验
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 01 - 检出构建仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: 02 - 生成统一构建标识
        id: identity
        run: python3 scripts/ax5-build.py identity
      - name: 03 - 安装配置工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget \
            clang llvm lld flex bison bc
      - name: 04 - 解析并核验 OpenWrt 配置
        run: |
          python3 scripts/ax5-build.py clone "$GITHUB_WORKSPACE/openwrt"
          python3 scripts/ax5-build.py prepare "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          ./scripts/feeds update -a
          python3 "$GITHUB_WORKSPACE/scripts/ax5-build.py" patch-feeds .
          ./scripts/feeds install -a
          bash "$GITHUB_WORKSPACE/scripts/customize-ax5.sh"
          python3 "$GITHUB_WORKSPACE/scripts/ax5-build.py" configure .
          python3 "$GITHUB_WORKSPACE/scripts/ax5-build.py" kernel-preflight .
      - name: 05 - 上传配置与溯源诊断
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: ${{ steps.identity.outputs.config_artifact || format('ax5-jdcloud-config-r{0}-a{1}', github.run_id, github.run_attempt) }}
          include-hidden-files: true
          path: |
            openwrt/.config
            openwrt/provenance/
          if-no-files-found: ignore
          retention-days: 7
