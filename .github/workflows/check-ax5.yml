name: Check AX5 build helpers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/ax5-build.py"
      - "scripts/customize-ax5.sh"
      - "configs/ax5-build.lock.json"
      - "configs/ipq60xx-custom-wifi.config"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "configs/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax5-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/customize-ax5.sh
      - run: shellcheck scripts/customize-ax5.sh

  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install configuration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
      - name: Resolve real OpenWrt configuration
        run: |
          python3 scripts/ax5-build.py clone "$GITHUB_WORKSPACE/openwrt"
          python3 scripts/ax5-build.py prepare "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash "$GITHUB_WORKSPACE/scripts/customize-ax5.sh"
          make defconfig
          python3 "$GITHUB_WORKSPACE/scripts/ax5-build.py" verify .
          python3 "$GITHUB_WORKSPACE/scripts/ax5-build.py" snapshot .
      - name: Upload resolved config
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ax5-config-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            openwrt/.config
            openwrt/provenance/
          if-no-files-found: ignore
          retention-days: 7
